name: Update OPCG card data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/cards.json'
      - 'debug/**'
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-scraper-v2.txt
      - run: python -m playwright install --with-deps chromium
      - name: Scrape official site
        run: python tools/scrape_official_v2.py
      - name: Show result
        run: |
          echo '===== cards.json ====='
          cat data/cards.json
          echo '===== debug files ====='
          find debug -maxdepth 2 -type f -printf '%p %s bytes\n' || true
      - name: Upload scraper diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opcg-scraper-debug
          path: |
            debug/
            data/cards.json
          if-no-files-found: warn
      - name: Commit card data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cards.json debug/page.html debug/network.json || true
          if git diff --cached --quiet; then
            echo 'No card-data changes to commit.'
            exit 0
          fi
          git commit -m 'chore: update official OPCG card data'
          git pull --rebase origin main
          git push origin HEAD:main
