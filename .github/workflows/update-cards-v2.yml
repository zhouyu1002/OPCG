name: Update OPCG card data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-scraper-v2.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/scrape_official_v2.py
      - name: Commit card data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cards.json data/api-discovery.json || true
          git diff --cached --quiet || git commit -m 'chore: update official OPCG card data'
          git push