name: Update OPCG Cards

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write

concurrency:
  group: update-opcg-cards
  cancel-in-progress: true

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-scraper-v2.txt
          python -m playwright install --with-deps chromium

      - name: Scrape official card list
        run: python tools/scrape_official_v2.py

      - name: Download official card images locally
        run: python tools/download_images.py

      - name: Show final card and image result
        run: |
          echo '===== FINAL CARD IMAGE RESULT ====='
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/cards.json')
          if not p.exists():
              print('ERROR: data/cards.json was not created')
              raise SystemExit(1)
          data = json.loads(p.read_text(encoding='utf-8'))
          total = sum(len(v) for v in data.values())
          local = sum(1 for v in data.values() for c in v if c.get('localImage'))
          missing = total - local
          print(f'TOTAL CARDS: {total}')
          print(f'LOCAL IMAGES: {local}')
          print(f'MISSING IMAGES: {missing}')
          print('')
          for key in data:
              cards = data[key]
              count = len(cards)
              images = sum(1 for c in cards if c.get('localImage'))
              print(f'{key}: {count} cards / {images} local images')
          if total == 0:
              print('ERROR: No cards were detected.')
              raise SystemExit(1)
          if local == 0:
              print('ERROR: No card images were downloaded.')
              raise SystemExit(1)
          PY

      - name: Upload scraper diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opcg-scraper-debug
          path: |
            data/cards.json
            debug/
          if-no-files-found: warn

      - name: Commit updated card data and images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/cards.json
          if [ -d images ]; then git add images/; fi
          if [ -d debug ]; then git add debug/; fi

          if git diff --cached --quiet; then
            echo 'No card-data or image changes to commit.'
            exit 0
          fi

          git commit -m 'chore: update official OPCG card data and images'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
