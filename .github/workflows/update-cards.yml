name: Update OPCG Cards

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write

concurrency:
  group: update-opcg-cards
  cancel-in-progress: true

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-scraper-v2.txt
          python -m playwright install --with-deps chromium

      - name: Scrape official card list
        run: python tools/scrape_official_v2.py

      - name: Download official card images locally
        run: python tools/download_images.py

      - name: Show scrape result
        run: |
          echo '===== OPCG SCRAPER RESULT ====='
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/cards.json')
          data = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          total = sum(len(v) for v in data.values())
          local = sum(1 for v in data.values() for c in v if c.get('localImage'))
          print(f'TOTAL CARDS: {total}')
          print(f'LOCAL IMAGES: {local}')
          for key, cards in data.items():
              print(f'{key}: {len(cards)} cards / {sum(1 for c in cards if c.get("localImage"))} local images')
          PY

      - name: Upload scraper diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opcg-scraper-debug
          path: |
            data/cards.json
            debug/
          if-no-files-found: warn

      - name: Commit updated card data and images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cards.json debug/page.html debug/network.json debug/image-download-failures.json images/ || true
          if git diff --cached --quiet; then
            echo 'No card-data or image changes to commit.'
            exit 0
          fi
          git commit -m 'chore: update official OPCG card data and images'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
