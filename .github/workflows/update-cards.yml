name: 更新 OPCG 官方卡圖資料

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install -r requirements-scraper.txt
          python -m playwright install --with-deps chromium
      - name: 抓取官方卡表
        run: python tools/scrape_official.py
      - name: Commit cards.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cards.json
          git diff --cached --quiet || git commit -m '更新官方 OPCG 卡圖資料'
          git push
